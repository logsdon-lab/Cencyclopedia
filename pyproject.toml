[project]
authors = [{name = "Keith", email = "koisland@pm.me"}]
name = "Cencyclopedia"
description = "Centromere interactive viewer."
license = {text = "MIT License"}
requires-python = ">=3.12,<3.14"
version = "0.0.2"
dependencies = ["polars>=1.43.2,<2", "plotly>=6.9.0,<7", "dash>=4.4.1,<5", "pyyaml", "loguru>=0.7.3,<0.8", "pillow>=12.3.0,<13", "dash-bootstrap-components>=2.0.4,<3", "gunicorn>=26.0.0,<27", "numpy", "pysam>=0.24.0,<0.25", "dash-uploader>=0.6.1,<0.7", "pybigtools>=0.3.0,<0.4", "frozendict>=2.4.7,<3"]

[project.urls]
Homepage = "https://github.com/logsdon-lab/Cencyclopedia"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatchling.packages.find]
include = ["cencyclopedia*"]
exclude = ["docs*", "test*"]

[tool.pixi.workspace]
channels = ["conda-forge", "https://conda.anaconda.org/bioconda"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.14"
pip = ">=26.2.1,<27"
ruff = ">=0.16.2,<0.17"
basedpyright = ">=1.39.8,<2"
bigtools = { version = ">=0.5.8,<0.6", channel = "bioconda" }
snakemake = ">=9.25.1,<10"
snakefmt = ">=2.0.3,<3"
samtools = ">=1.24,<2"

[tool.pixi.pypi-dependencies]
cencyclopedia = { path = ".", editable = true }

[tool.pyright]
reportCallIssue = false
typeCheckingMode = "standard"

[tool.ruff]
lint.ignore = ["F403", "E731"]

[tool.pixi.tasks]
local = "gunicorn -b 0.0.0.0:8050 'cencyclopedia.app:server()'"
check = "basedpyright ."
fmt = "ruff format ."
